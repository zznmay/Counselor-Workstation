/* ---------- 左上品牌行 ---------- */
.brand-row{position:absolute;left:4rem;top:2.85rem;height:2.85rem;display:flex;align-items:center}
.brand-row img{display:block;width:2.85rem;height:2.75rem}
.brand-row .zx{margin-left:1.3rem;font-size:2.4rem;font-weight:900;color:#fff;letter-spacing:.1rem;line-height:1}
.brand-row .zw{margin-left:1.2rem;align-self:flex-end;padding-bottom:.35rem;font-size:1.35rem;font-weight:400;color:rgba(255,255,255,.95);line-height:1}

/* ---------- 右上标语 ---------- */
.slogan-top{position:absolute;right:4rem;top:3.85rem;margin:0;font-size:.95rem;line-height:1.5rem;letter-spacing:.05rem;color:rgba(255,255,255,.95)}

/* ---------- 左侧主文案 ---------- */
.hero-title{
  position:absolute;left:5.25rem;top:11rem;margin:0;
  font-size:5.1rem;line-height:6.1rem;font-weight:900;color:#fff;
  letter-spacing:.25rem;-webkit-text-stroke:.5px #fff; /* 补足参考图更重的笔画 */
}
.hero-title span{display:block}
.hero-title .l2{padding-left:1.65rem}   /* 参考图第二行确有缩进 */
.hero-dash{position:absolute;left:5.9rem;top:23.9rem;width:1.7rem;height:.3rem;border-radius:.15rem;background:rgba(255,255,255,.92)}
.hero-sub{position:absolute;left:6.4rem;top:25.1rem;margin:0;font-size:1.2rem;line-height:2rem;letter-spacing:.45rem;color:rgba(255,255,255,.96)}

/* 三项特色 */
.feats{position:absolute;left:4.75rem;top:29.5rem;margin:0;padding:0;list-style:none;display:flex}
.feats li{width:6.35rem;display:flex;flex-direction:column;align-items:center}
.feats svg{display:block;width:2rem;height:1.7rem;color:#fff}
.feats .t{margin-top:.55rem;font-size:.8rem;line-height:1.1rem;color:rgba(255,255,255,.96);letter-spacing:.05rem}

/* ---------- 登录卡片 ---------- */
.card{
  position:absolute;left:51.65rem;top:8.55rem;width:28.85rem;height:32.45rem;
  background:#fff;border-radius:2.4rem;
  box-shadow:0 1.2rem 3rem rgba(16,74,171,.16),0 .4rem 1rem rgba(16,74,171,.08);
}
.card__title{position:absolute;left:3.55rem;top:3.65rem;margin:0;font-size:2.25rem;line-height:3rem;font-weight:800;color:var(--ink)}
.card__sub{position:absolute;left:3.55rem;top:7.05rem;margin:0;font-size:1.2rem;line-height:1.6rem;color:var(--ink-2)}

/* 输入框 */
.field{
  position:absolute;left:3.6rem;width:21.4rem;height:3.6rem;
  border:1px solid var(--line);border-radius:.7rem;background:#fff;
  display:flex;align-items:center;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.field--user{top:10.75rem}
.field--pwd{top:15.25rem}
.field:focus-within{border-color:var(--brand);box-shadow:0 0 0 .3rem rgba(17,109,233,.08)}
.field__ico{position:absolute;left:1.4rem;top:50%;transform:translateY(-50%);width:1.2rem;height:1.2rem;color:var(--ico);pointer-events:none}
.field input{
  width:100%;height:100%;margin:0;border:0;background:none;outline:none;
  font:inherit;font-size:1.02rem;color:var(--ink);word-spacing:-.15rem;
  padding:0 3.4rem 0 3.65rem;border-radius:.7rem;
}
.field input::placeholder{color:var(--ph)}
.field__eye{
  position:absolute;right:.8rem;top:50%;transform:translateY(-50%);
  width:2.4rem;height:2.4rem;padding:0;border:0;background:none;cursor:pointer;
  display:grid;place-items:center;color:#3A3D45;
}
.field__eye svg{width:1.6rem;height:1.6rem}

/* 登录按钮 */
.btn{
  position:absolute;left:3.6rem;top:20.7rem;width:21.6rem;height:3.6rem;
  border:0;border-radius:99rem;background:var(--brand);color:#fff;
  font:inherit;font-size:1.2rem;font-weight:600;letter-spacing:.1rem;
  cursor:pointer;transition:background .15s ease,transform .12s ease;
}
.btn:hover{background:var(--brand-hover)}
.btn:active{transform:scale(.99);background:var(--brand-active)}

/* 协议行 */
.agree{position:absolute;left:3.6rem;top:26.75rem;display:flex;align-items:flex-start}
.agree input{
  appearance:none;-webkit-appearance:none;flex:none;
  width:1.2rem;height:1.2rem;margin:0;
  border:1px solid var(--cb-line);border-radius:.35rem;background:#fff;
  cursor:pointer;position:relative;
}
.agree input:checked{background:var(--brand);border-color:var(--brand)}
.agree input:checked::after{
  content:"";position:absolute;left:.32rem;top:.14rem;
  width:.25rem;height:.52rem;border:solid #fff;border-width:0 .15rem .15rem 0;
  transform:rotate(45deg);
}
.agree label{margin-left:.4rem;font-size:.82rem;line-height:1.1rem;color:var(--agree);cursor:pointer;white-space:nowrap}
.agree a{color:var(--brand);text-decoration:none}
.agree a:hover{text-decoration:underline}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<main class="stage">

<script>
(function () {
  // 密码可见性切换
  var pwd = document.getElementById('pwd');
  var eye = document.getElementById('eye');
  eye.addEventListener('click', function () {
    var show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    eye.setAttribute('aria-pressed', String(show));
    eye.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
    eye.style.opacity = show ? '.55' : '1';
  });
  // 静态还原页: 拦截表单提交
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
  });
})();
</script>
