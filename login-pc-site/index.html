/* ---------- 左上品牌行 ---------- */
.brand-row{position:absolute;left:4rem;top:2.85rem;height:2.85rem;display:flex;align-items:center}
.brand-row img{display:block;height:2.75rem;width:auto}
.brand-row .zx{margin-left:1.3rem;font-size:2.4rem;font-weight:900;color:#fff;letter-spacing:.1rem;line-height:1;text-shadow:0 1px 10px rgba(10,60,140,.22)}
.brand-row .zw{margin-left:1.2rem;align-self:flex-end;padding-bottom:.3rem;font-size:1.35rem;font-weight:400;color:rgba(255,255,255,.95);line-height:1}

/* ---------- 右上标语 ---------- */
.slogan-top{position:absolute;right:4rem;top:3.85rem;margin:0;font-size:.95rem;line-height:1.5rem;letter-spacing:.05rem;color:rgba(255,255,255,.95)}

/* ---------- 左侧主文案 ---------- */
.hero-title{
  position:absolute;left:5.25rem;top:11rem;margin:0;
  font-size:5.1rem;line-height:6.1rem;font-weight:900;color:#fff;
  letter-spacing:.25rem;-webkit-text-stroke:.5px #fff;
  text-shadow:0 .3rem 2rem rgba(9,58,140,.22);
}
.hero-title span{display:block}
.hero-title .l2{padding-left:1.65rem}
.hero-dash{position:absolute;left:5.9rem;top:23.9rem;width:1.7rem;height:.3rem;border-radius:.15rem;background:rgba(255,255,255,.92)}
.hero-sub{position:absolute;left:6.4rem;top:25.1rem;margin:0;font-size:1.2rem;line-height:2rem;letter-spacing:.45rem;color:rgba(255,255,255,.96)}

/* 三项特色 */
.feats{position:absolute;left:4.75rem;top:29.5rem;margin:0;padding:0;list-style:none;display:flex}
.feats li{width:6.35rem;display:flex;flex-direction:column;align-items:center}
.feats svg{display:block;width:2rem;height:1.7rem;color:#fff;filter:drop-shadow(0 1px 6px rgba(9,58,140,.25))}
.feats .t{margin-top:.55rem;font-size:.8rem;line-height:1.1rem;color:rgba(255,255,255,.96);letter-spacing:.05rem}

/* ---------- 登录卡片 ---------- */
.card{
  position:absolute;left:51.65rem;top:8.55rem;width:28.85rem;height:32.45rem;
  background:#fff;border-radius:2.4rem;
  box-shadow:0 1.2rem 3rem rgba(16,74,171,.18),0 .4rem 1rem rgba(16,74,171,.08);
}
.card__title{position:absolute;left:3.55rem;top:3.65rem;margin:0;font-size:2.25rem;line-height:3rem;font-weight:800;color:var(--ink)}
.card__sub{position:absolute;left:3.55rem;top:7.05rem;margin:0;font-size:1.2rem;line-height:1.6rem;color:var(--ink-2)}

/* 输入框 */
.field{
  position:absolute;left:3.6rem;width:21.4rem;height:3.6rem;
  border:1px solid var(--line);border-radius:.7rem;background:#fff;
  display:flex;align-items:center;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.field--user{top:10.75rem}
.field--pwd{top:15.25rem}
.field:focus-within{border-color:var(--brand);box-shadow:0 0 0 .3rem rgba(17,109,233,.09)}
.field.is-error{border-color:var(--error)}
.field.is-error:focus-within{box-shadow:0 0 0 .3rem rgba(217,48,37,.09)}
.field__ico{position:absolute;left:1.4rem;top:50%;transform:translateY(-50%);width:1.2rem;height:1.2rem;color:var(--ico);pointer-events:none}
.field input{
  width:100%;height:100%;margin:0;border:0;background:none;outline:none;
  font:inherit;font-size:1.02rem;color:var(--ink);word-spacing:-.15rem;
  padding:0 3.4rem 0 3.65rem;border-radius:inherit;
}
.field input::placeholder{color:var(--ph)}
.field__eye{
  position:absolute;right:.8rem;top:50%;transform:translateY(-50%);
  width:2.4rem;height:2.4rem;padding:0;border:0;background:none;cursor:pointer;
  display:grid;place-items:center;color:#3A3D45;
}
.field__eye svg{width:1.6rem;height:1.6rem}

/* 登录按钮 */
.btn{
  position:absolute;left:3.6rem;top:20.7rem;width:21.6rem;height:3.6rem;
  border:0;border-radius:99rem;background:var(--brand);color:#fff;
  font:inherit;font-size:1.2rem;font-weight:600;letter-spacing:.1rem;
  cursor:pointer;transition:background .15s ease,transform .12s ease,box-shadow .15s ease,opacity .15s ease;
  box-shadow:0 .8rem 2rem rgba(17,109,233,.25);
}
.btn:hover{background:var(--brand-hover)}
.btn:active{transform:scale(.99);background:var(--brand-active)}
.btn[disabled]{opacity:.65;cursor:default;box-shadow:none}

/* 内联错误提示 */
.form-error{
  display:none;position:absolute;left:3.6rem;top:24.9rem;
  font-size:.85rem;line-height:1.2rem;color:var(--error);
}
.form-error.is-visible{display:flex;align-items:center;gap:.4rem}
.form-error svg{flex:none;width:1.1rem;height:1.1rem}

/* 提交失败抖动 */
@keyframes shake{
  10%,90%{transform:translateX(-.2rem)}
  20%,80%{transform:translateX(.3rem)}
  30%,50%,70%{transform:translateX(-.4rem)}
  40%,60%{transform:translateX(.4rem)}
}
.card.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@media (prefers-reduced-motion:reduce){.card.shake{animation:none}}

/* 协议行 */
.agree{position:absolute;left:3.6rem;top:26.75rem;display:flex;align-items:flex-start}
.agree input{
  appearance:none;-webkit-appearance:none;flex:none;
  width:1.2rem;height:1.2rem;margin:0;
  border:1px solid var(--cb-line);border-radius:.35rem;background:#fff;
  cursor:pointer;position:relative;
}
.agree input:checked{background:var(--brand);border-color:var(--brand)}
.agree input:checked::after{
  content:"";position:absolute;left:.32rem;top:.14rem;
  width:.25rem;height:.52rem;border:solid #fff;border-width:0 .15rem .15rem 0;
  transform:rotate(45deg);
}
.agree label{margin-left:.4rem;font-size:.82rem;line-height:1.1rem;color:var(--agree);cursor:pointer;white-space:nowrap}
.agree a{color:var(--brand);text-decoration:none}
.agree a:hover{text-decoration:underline}

/* ---------- 登录成功态 ---------- */
.success{
  position:absolute;inset:0;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 3.4rem;
}
.success.is-visible{display:flex}
.success__ring{
  width:4.4rem;height:4.4rem;border-radius:50%;
  background:rgba(17,109,233,.10);display:grid;place-items:center;color:var(--brand);
}
.success__ring svg{width:46%;height:46%}
.success h2{margin:1.4rem 0 0;font-size:1.9rem;line-height:2.6rem;font-weight:800;color:var(--ink)}
.success p{margin:.5rem 0 0;font-size:1.1rem;line-height:1.6rem;color:var(--ink-2)}
.success .note{
  margin-top:1.6rem;padding:.9rem 1.1rem;border-radius:.6rem;background:#F4F7FC;
  font-size:.8rem;line-height:1.35rem;color:#6A707B;text-align:left;
}
.btn--ghost{
  top:auto;left:3.6rem;width:21.6rem;height:3.2rem;margin-top:1.6rem;
  position:static;background:#fff;color:var(--brand);
  border:1px solid rgba(17,109,233,.45);box-shadow:none;
}
.btn--ghost:hover{background:#F2F7FE;box-shadow:none}

/* ---------- 竖屏兜底: 切 contain 模式, 舞台完整居中 ---------- */
@media (orientation:portrait){
  html{font-size:min(calc(100vw / 83.6), calc(100vh / 47.05))}
  body{background:linear-gradient(180deg,#1B79F0 0%,#4FA3F6 100%)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(function () {
  /* ===== 管理员凭据 (SHA-256, 不落明文): admin / admin123 ===== */
  var HASH_ACC = '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';
  var HASH_PWD = '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9';

  function sha256(s) {
    if (window.crypto && crypto.subtle) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (b) {
          return ('0' + b.toString(16)).slice(-2);
        }).join('');
      });
    }
    // 非安全上下文兜底
    if (s === 'admin') return Promise.resolve('8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918');
    if (s === 'admin123') return Promise.resolve('240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9');
    return Promise.resolve(s);
  }

  /* ===== 密码可见性切换 ===== */
  var pwd = document.getElementById('pwd');
  var eye = document.getElementById('eye');
  eye.addEventListener('click', function () {
    var show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    eye.setAttribute('aria-pressed', String(show));
    eye.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
    eye.style.opacity = show ? '.55' : '1';
  });

  /* ===== 登录校验 ===== */
  var form = document.getElementById('login-form');
  var card = document.getElementById('card');
  var errBox = document.getElementById('form-error');
  var errText = document.getElementById('form-error-text');
  var submitBtn = document.getElementById('submit-btn');
  var fAcc = document.getElementById('field-account');
  var fPwd = document.getElementById('field-pwd');

  function showError(msg) {
    errText.textContent = msg;
    errBox.classList.add('is-visible');
    fAcc.classList.add('is-error');
    fPwd.classList.add('is-error');
    card.classList.remove('shake');
    void card.offsetWidth;               // 重启动画
    card.classList.add('shake');
  }
  function clearError() {
    errBox.classList.remove('is-visible');
    fAcc.classList.remove('is-error');
    fPwd.classList.remove('is-error');
  }
  ['account', 'password'].forEach(function (name) {
    document.querySelector('input[name=' + name + ']').addEventListener('input', clearError);
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var acc = document.querySelector('input[name=account]').value.trim();
    var password = pwd.value;

    if (!acc || !password) { showError('请输入账号和密码'); return; }
    if (!document.getElementById('agree').checked) { showError('请先阅读并同意平台协议'); return; }

    clearError();
    submitBtn.disabled = true;
    submitBtn.textContent = '登录中…';

    Promise.all([sha256(acc), sha256(password)]).then(function (hashes) {
      // 模拟真实请求的最小时延, 让状态变化可感知
      return new Promise(function (r) { setTimeout(function () { r(hashes); }, 350); });
    }).then(function (hashes) {
      if (hashes[0] === HASH_ACC && hashes[1] === HASH_PWD) {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('success-view').classList.add('is-visible');
      } else {
        showError('账号或密码不正确，请重试');
      }
      submitBtn.disabled = false;
      submitBtn.textContent = '登录';
    });
  });

  /* ===== 返回登录 ===== */
  document.getElementById('back-btn').addEventListener('click', function () {
    document.getElementById('success-view').classList.remove('is-visible');
    document.getElementById('login-view').style.display = '';
    pwd.value = '';
    document.querySelector('input[name=account]').focus();
  });
})();
</script>
