<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel 数据拆分工具</title>
    <!-- 运行库本地化（与工作台同源伺服，无外网依赖） -->
    <script src="./vendor/xlsx.full.min.js"></script>
    <script src="./vendor/jszip.min.js"></script>
    <style>
        /* ======================================================================
           视觉规范与工作台一致：「未来界面蓝」#5F86FF / #A9C2FF / #F4F7FF / #2F3E66
           支持 light / dark 双主题：由 URL ?theme= 或父页面 postMessage 控制
           ====================================================================== */
        :root {
            --bg: #ffffff;
            --bg-elevated: #f4f7ff;
            --bg-hover: #eef3fc;
            --border: #e3eaf6;
            --border-strong: #c9d6f2;
            --accent: #5f86ff;
            --accent-strong: #4a6fe3;
            --accent-light: #7d9bff;
            --accent-soft: #a9c2ff;
            --accent-glow: rgba(95, 134, 255, 0.16);
            --success: #5ca97f;
            --warning: #c08a3e;
            --warning-bg: #fdf4e3;
            --warning-border: #efdfb3;
            --warning-text: #8a6d2f;
            --danger: #d9645c;
            --info: #5f86ff;
            --text-primary: #2f3e66;
            --text-secondary: #4a5a7e;
            --text-muted: #7686a8;
            --text-dim: #8a99b5;
            --card-shadow: 0 1px 2px rgba(47, 62, 102, 0.04), 0 8px 22px rgba(47, 62, 102, 0.06);
            --card-shadow-hover: 0 2px 6px rgba(47, 62, 102, 0.06), 0 14px 34px rgba(47, 62, 102, 0.1);
            --radius: 14px;
        }

        html[data-theme='dark'] {
            --bg: #12172a;
            --bg-elevated: #1f2740;
            --bg-hover: #232b45;
            --border: #2c3450;
            --border-strong: #3a4468;
            --accent: #5f86ff;
            --accent-strong: #7d9bff;
            --accent-light: #8fa9ff;
            --accent-soft: #3a4468;
            --accent-glow: rgba(95, 134, 255, 0.24);
            --success: #5cae8a;
            --warning: #dfa050;
            --warning-bg: rgba(223, 158, 63, 0.12);
            --warning-border: rgba(223, 158, 63, 0.3);
            --warning-text: #dfa050;
            --danger: #e07a6e;
            --info: #5f86ff;
            --text-primary: #e6eaf5;
            --text-secondary: #9fabc9;
            --text-muted: #8f9cb8;
            --text-dim: #6c7897;
            --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.32);
            --card-shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.42);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
                'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 18px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%; left: -15%;
            width: 70vw; height: 70vw;
            background: radial-gradient(circle, rgba(95,134,255,0.07) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        html[data-theme='dark'] body::before {
            background: radial-gradient(circle, rgba(95,134,255,0.1) 0%, transparent 60%);
        }

        .container { max-width: 1080px; margin: 0 auto; position: relative; z-index: 1; }

        .header { text-align: center; margin-bottom: 22px; }
        .header h1 {
            font-size: 1.35rem; font-weight: 600; color: var(--text-primary);
            margin-bottom: 8px; display: inline-flex; align-items: center; gap: 10px;
        }
        .header h1::before {
            content: '';
            width: 5px; height: 22px; border-radius: 3px;
            background: linear-gradient(180deg, #5F86FF, #A9C2FF);
            box-shadow: 0 4px 10px rgba(95, 134, 255, 0.35);
        }
        .header p { font-size: 13px; color: var(--text-muted); }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            padding: 22px 26px;
            margin-bottom: 18px;
            transition: box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .card:hover { box-shadow: var(--card-shadow-hover); }

        .card-title {
            font-size: 0.98rem; font-weight: 600; color: var(--text-primary);
            margin-bottom: 18px; display: flex; align-items: center; gap: 10px;
        }
        .card-title .step {
            display: inline-flex; align-items: center; justify-content: center;
            width: 26px; height: 26px;
            background: linear-gradient(135deg, #5F86FF, #7D9BFF);
            color: #fff; border-radius: 50%; font-size: 0.78rem; font-weight: 600; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(95, 134, 255, 0.3);
        }

        /* Upload Area */
        .upload-area {
            border: 1.5px dashed var(--border-strong); border-radius: 12px;
            padding: 40px 24px; text-align: center; cursor: pointer;
            transition: all 0.25s ease; background: var(--bg-elevated);
        }
        .upload-area:hover, .upload-area.dragover { border-color: var(--accent); background: var(--accent-glow); }
        .upload-area .icon { font-size: 40px; margin-bottom: 10px; }
        .upload-area .text { font-size: 15px; color: var(--text-secondary); margin-bottom: 4px; }
        .upload-area .hint { font-size: 13px; color: var(--text-dim); }
        .upload-area input[type="file"] { display: none; }

        /* File Info */
        .file-info {
            display: none; align-items: center; gap: 12px;
            padding: 13px 18px; background: var(--success-bg, #e9f3ed);
            border: 1px solid rgba(92, 169, 127, 0.3); border-radius: 10px; margin-top: 16px;
        }
        .file-info.show { display: flex; }
        .file-info .file-icon { font-size: 26px; }
        .file-info .file-details { flex: 1; }
        .file-info .file-name { font-weight: 600; color: var(--text-primary); font-size: 14px; }
        .file-info .file-meta { font-size: 12px; color: var(--success); margin-top: 2px; }
        .file-info .remove-btn {
            background: none; border: none; cursor: pointer;
            font-size: 20px; color: var(--danger); padding: 4px 8px; border-radius: 6px;
        }
        .file-info .remove-btn:hover { background: rgba(217, 100, 92, 0.12); }

        /* Sheet Tabs */
        .sheet-tabs { display: none; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
        .sheet-tabs.show { display: flex; }
        .sheet-tab {
            padding: 8px 18px; border: 1px solid var(--border); border-radius: 8px;
            background: var(--bg-card); cursor: pointer; font-size: 13px;
            color: var(--text-secondary); transition: all 0.2s; font-family: inherit;
        }
        .sheet-tab:hover { border-color: var(--accent); color: var(--accent); }
        .sheet-tab.active {
            background: linear-gradient(135deg, #5F86FF, #7D9BFF); color: #fff;
            border-color: transparent; box-shadow: 0 4px 12px rgba(95, 134, 255, 0.3);
        }

        /* Sheet badge */
        .sheet-tab .sheet-badge {
            font-size: 11px; background: rgba(95, 134, 255, 0.12); color: var(--accent);
            padding: 1px 6px; border-radius: 4px; margin-left: 6px; font-weight: 400;
        }
        .sheet-tab.active .sheet-badge { background: rgba(255,255,255,0.25); color: #fff; }

        /* Header Row Setting */
        .header-row-setting {
            display: none; align-items: center; gap: 12px; margin-top: 14px;
            padding: 12px 16px; background: var(--warning-bg);
            border: 1px solid var(--warning-border);
            border-radius: 10px; font-size: 13px; color: var(--warning-text);
        }
        .header-row-setting.show { display: flex; }
        .header-row-setting label { font-weight: 600; white-space: nowrap; }
        .header-row-setting input[type="number"] {
            width: 80px; padding: 6px 10px; border: 1px solid var(--warning-border);
            border-radius: 6px; font-size: 13px; text-align: center; outline: none;
            background: var(--bg-card); color: var(--text-primary); font-family: inherit;
        }
        .header-row-setting input[type="number"]:focus { border-color: var(--accent); }
        .header-row-setting .auto-detected { color: var(--success); font-weight: 500; }

        .field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 16px; }
        .field-item {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px; background: var(--bg-elevated); border: 1px solid var(--border);
            border-radius: 10px; cursor: pointer; transition: all 0.2s;
            font-size: 14px; color: var(--text-secondary);
        }
        .field-item:hover { border-color: var(--accent); background: var(--accent-glow); }
        .field-item.selected {
            border-color: var(--accent); background: var(--accent-glow);
            box-shadow: 0 0 0 3px var(--accent-glow); color: var(--accent-light);
            font-weight: 500;
        }
        .field-item .radio {
            width: 18px; height: 18px; border: 1.5px solid var(--border-strong); border-radius: 50%;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .field-item.selected .radio { border-color: var(--accent); }
        .field-item.selected .radio::after { content: ''; width: 10px; height: 10px; background: var(--accent); border-radius: 50%; }
        .field-item .col-index {
            font-size: 11px; color: var(--text-dim); margin-left: auto;
            background: var(--bg-hover, #eef3fc); padding: 2px 8px; border-radius: 4px;
        }

        /* Settings */
        .settings-row { display: flex; align-items: center; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
        .settings-row label { font-size: 14px; font-weight: 500; color: var(--text-secondary); white-space: nowrap; }
        .settings-row input[type="number"] {
            width: 100px; padding: 10px 14px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 14px; text-align: center; outline: none;
            transition: border-color 0.2s; background: var(--bg-card); color: var(--text-primary);
            font-family: inherit;
        }
        .settings-row input[type="number"]:focus {
            border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .settings-row .info-text { font-size: 12px; color: var(--text-dim); }

        /* Preview */
        .preview-wrapper { margin-top: 16px; max-height: 300px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
        .preview-wrapper::-webkit-scrollbar { width: 6px; height: 6px; }
        .preview-wrapper::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
        .preview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .preview-table th {
            background: #edf2ff; padding: 10px 14px; text-align: left;
            font-weight: 600; color: #3d4e7a; border-bottom: 2px solid var(--border);
            position: sticky; top: 0; z-index: 1;
        }
        html[data-theme='dark'] .preview-table th { background: #232b45; }
        .preview-table td {
            padding: 8px 14px; border-bottom: 1px solid var(--border);
            color: var(--text-secondary); max-width: 200px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .preview-table tr:hover td { background: var(--bg-hover); }
        .preview-table .highlight-col { background: var(--accent-glow); font-weight: 600; color: var(--accent); }
        .preview-table th.highlight-col { background: #e0eaff; color: var(--accent-strong); }
        html[data-theme='dark'] .preview-table th.highlight-col { background: rgba(95, 134, 255, 0.2); }

        /* Split Info */
        .split-info {
            display: none; padding: 16px 20px; background: var(--accent-glow);
            border: 1px solid rgba(95, 134, 255, 0.3); border-radius: 10px; margin-top: 16px;
        }
        .split-info.show { display: block; }
        .split-info .info-title { font-weight: 600; color: var(--accent); margin-bottom: 8px; font-size: 14px; }
        .split-info .info-detail { font-size: 13px; color: var(--text-secondary); line-height: 1.8; }
        .split-info .info-detail strong { color: var(--accent); }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 11px 26px; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
            font-family: inherit;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary {
            background: linear-gradient(135deg, #5F86FF, #7D9BFF); color: #fff;
            box-shadow: 0 6px 16px rgba(95, 134, 255, 0.32);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #4a74f0, #6e92ff);
            transform: translateY(-1px); box-shadow: 0 8px 22px rgba(95, 134, 255, 0.4);
        }
        .btn-primary:active:not(:disabled) { transform: translateY(0); }
        .btn-secondary { background: var(--bg-hover); color: var(--text-secondary); }
        .btn-secondary:hover:not(:disabled) { background: var(--border); }
        .btn-success {
            background: linear-gradient(135deg, #5ca97f, #74bb95); color: #fff;
            box-shadow: 0 6px 16px rgba(92, 169, 127, 0.3);
        }
        .btn-success:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(92, 169, 127, 0.38); }
        .btn-group { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }

        /* Progress */
        .progress-bar { display: none; margin-top: 16px; }
        .progress-bar.show { display: block; }
        .progress-track { height: 8px; background: var(--bg-hover); border-radius: 4px; overflow: hidden; }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #5F86FF, #A9C2FF);
            border-radius: 4px; transition: width 0.3s ease; width: 0%;
        }
        .progress-text { font-size: 13px; color: var(--text-muted); margin-top: 8px; text-align: center; }

        /* Result */
        .result-area { display: none; margin-top: 16px; }
        .result-area.show { display: block; }
        .result-list { max-height: 250px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; padding: 4px; }
        .result-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 14px;
            border-radius: 8px; font-size: 13px; color: var(--text-secondary);
        }
        .result-item:nth-child(even) { background: var(--bg-elevated); }
        .result-item .check { color: var(--success); font-size: 15px; }
        .result-item .file-name { flex: 1; font-weight: 500; }
        .result-item .row-count { color: var(--text-dim); font-size: 12px; }

        /* Toast */
        .toast {
            position: fixed; top: 20px; right: 20px; padding: 13px 22px; border-radius: 10px;
            font-size: 14px; font-weight: 500; color: #fff; z-index: 9999;
            transform: translateX(120%); transition: transform 0.3s ease;
            box-shadow: 0 12px 32px rgba(47, 62, 102, 0.2); max-width: 400px;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--info); }

        .card.disabled { opacity: 0.5; pointer-events: none; }
        .hidden { display: none !important; }

        @media (max-width: 640px) {
            body { padding: 12px; }
            .card { padding: 18px 16px; }
            .header h1 { font-size: 1.15rem; }
            .field-grid { grid-template-columns: 1fr; }
            .settings-row { flex-direction: column; align-items: flex-start; }
            .btn-group { flex-direction: column; }
            .btn-group .btn { width: 100%; }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Excel 数据拆分工具</h1>
            <p>上传 Excel 文件，按指定列自动拆分为多个文件并打包下载</p>
        </div>

        <!-- Step 1: Upload -->
        <div class="card" id="uploadCard">
            <div class="card-title"><span class="step">1</span> 上传 Excel 文件</div>
            <div class="upload-area" id="uploadArea">
                <div class="icon">📁</div>
                <div class="text">点击或拖拽 Excel 文件到此处</div>
                <div class="hint">支持 .xlsx / .xls 格式</div>
                <input type="file" id="fileInput" accept=".xlsx,.xls">
            </div>
            <div class="file-info" id="fileInfo">
                <span class="file-icon">📄</span>
                <div class="file-details">
                    <div class="file-name" id="fileName"></div>
                    <div class="file-meta" id="fileMeta"></div>
                </div>
                <button class="remove-btn" id="removeBtn" title="移除文件">✕</button>
            </div>
            <div class="sheet-tabs" id="sheetTabs"></div>
            <div class="sheet-tabs" id="sheetHint" style="display:none;margin-top:8px;font-size:13px;color:var(--text-muted);"></div>
        </div>

        <!-- Step 2: Select Column -->
        <div class="card disabled" id="columnCard">
            <div class="card-title"><span class="step">2</span> 选择拆分列</div>
            <p style="font-size:13px;color:var(--text-muted);margin-bottom:4px;">选择用于拆分数据的列，该列中相同值的数据行将被归到同一个文件中。</p>
            <div class="header-row-setting" id="headerRowSetting">
                <label>表头行数：</label>
                <input type="number" id="headerRowCount" value="1" min="1" max="20">
                <span id="headerRowHint" class="auto-detected"></span>
                <span style="margin-left:auto;font-size:12px;color:var(--warning);">多行表头将自动合并为列名</span>
            </div>
            <div class="field-grid" id="fieldGrid"></div>
        </div>

        <!-- Step 3: Settings -->
        <div class="card disabled" id="settingsCard">
            <div class="card-title"><span class="step">3</span> 拆分设置</div>
            <div class="settings-row">
                <label>从第几行开始拆分：</label>
                <input type="number" id="startRow" value="2" min="2" max="99999">
                <span class="info-text">默认从第 2 行开始（跳过表头）</span>
            </div>
            <div class="split-info" id="splitInfo">
                <div class="info-title">📋 拆分预览</div>
                <div class="info-detail" id="splitDetail"></div>
            </div>
            <div class="preview-wrapper hidden" id="previewWrapper">
                <table class="preview-table" id="previewTable"></table>
            </div>
        </div>

        <!-- Step 4: Save -->
        <div class="card disabled" id="saveCard">
            <div class="card-title"><span class="step">4</span> 下载拆分文件</div>
            <p style="font-size:13px;color:var(--text-muted);margin-bottom:4px;">拆分完成后，所有文件将打包为 ZIP 一次性下载，也可以逐个下载。</p>
            <div class="btn-group">
                <button class="btn btn-primary" id="splitBtn" disabled>⚡ 执行拆分并打包下载</button>
                <button class="btn btn-secondary" id="resetBtn">🔄 重新开始</button>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">准备中...</div>
            </div>
            <div class="result-area" id="resultArea">
                <div class="btn-group" id="downloadBtns" style="margin-top:12px;margin-bottom:12px;">
                    <button class="btn btn-success" id="downloadAllBtn">📦 下载全部 (ZIP)</button>
                    <button class="btn btn-secondary" id="downloadOneBtn">📄 逐个下载</button>
                </div>
                <div class="result-list" id="resultList"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ==================== State ====================
        let workbook = null;
        let currentSheet = null;
        let sheetData = [];
        let headers = [];
        let headerRows = [];       // raw header rows (multi-row header support)
        let headerMerges = [];      // merged cell ranges within header area
        let originalCols = [];      // original column widths
        let detectedHeaderCount = 1;
        let selectedColIndex = -1;
        let originalFileName = '';
        let splitResult = null; // { zipBlob, files: [{name, blob, rowCount}] }

        // ==================== DOM ====================
        const $ = id => document.getElementById(id);
        const uploadArea = $('uploadArea');
        const fileInput = $('fileInput');
        const fileInfo = $('fileInfo');
        const fileName = $('fileName');
        const fileMeta = $('fileMeta');
        const removeBtn = $('removeBtn');
        const sheetTabs = $('sheetTabs');
        const columnCard = $('columnCard');
        const fieldGrid = $('fieldGrid');
        const settingsCard = $('settingsCard');
        const startRowInput = $('startRow');
        const splitInfo = $('splitInfo');
        const splitDetail = $('splitDetail');
        const previewWrapper = $('previewWrapper');
        const previewTable = $('previewTable');
        const saveCard = $('saveCard');
        const splitBtn = $('splitBtn');
        const resetBtn = $('resetBtn');
        const progressBar = $('progressBar');
        const progressFill = $('progressFill');
        const progressText = $('progressText');
        const resultArea = $('resultArea');
        const resultList = $('resultList');
        const downloadAllBtn = $('downloadAllBtn');
        const downloadOneBtn = $('downloadOneBtn');
        const toast = $('toast');
        const headerRowSetting = $('headerRowSetting');
        const headerRowCountInput = $('headerRowCount');
        const headerRowHint = $('headerRowHint');
        const sheetHint = $('sheetHint');

        // ==================== Toast ====================
        function showToast(msg, type = 'info', duration = 3000) {
            toast.textContent = msg;
            toast.className = 'toast ' + type;
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        // ==================== Step 1: Upload ====================
        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', e => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', e => { if (e.target.files.length > 0) handleFile(e.target.files[0]); });
        removeBtn.addEventListener('click', resetAll);

        function handleFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (!['xlsx', 'xls'].includes(ext)) {
                showToast('请上传 .xlsx 或 .xls 格式的文件', 'error');
                return;
            }
            originalFileName = file.name.replace(/\.[^.]+$/, '');
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    workbook = XLSX.read(e.target.result, { type: 'array' });
                    fileName.textContent = file.name;
                    const sizeMB = (file.size / 1024 / 1024).toFixed(2);
                    fileMeta.textContent = `${workbook.SheetNames.length} 个工作表 · ${sizeMB} MB`;
                    fileInfo.classList.add('show');
                    uploadArea.style.display = 'none';
                    renderSheetTabs();
                    loadSheet(workbook.SheetNames[0]);
                    showToast('文件解析成功！', 'success');
                } catch (err) {
                    showToast('文件解析失败：' + err.message, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function renderSheetTabs() {
            sheetTabs.innerHTML = '';
            sheetHint.style.display = 'none';
            if (workbook.SheetNames.length <= 1) { sheetTabs.classList.remove('show'); return; }
            sheetTabs.classList.add('show');

            // Show hint for multi-sheet files
            sheetHint.style.display = 'block';
            sheetHint.innerHTML = '💡 该文件包含多个工作表，请点击下方标签选择需要拆分的工作表：';

            workbook.SheetNames.forEach(name => {
                const ws = workbook.Sheets[name];
                const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
                const rowCount = range.e.r - range.s.r + 1;
                const colCount = range.e.c - range.s.c + 1;
                const tab = document.createElement('div');
                tab.className = 'sheet-tab';
                tab.dataset.sheet = name;
                tab.innerHTML = `${esc(name)}<span class="sheet-badge">${rowCount}行 × ${colCount}列</span>`;
                tab.addEventListener('click', () => loadSheet(name));
                sheetTabs.appendChild(tab);
            });
        }

        function loadSheet(name) {
            currentSheet = name;
            document.querySelectorAll('.sheet-tab').forEach(t => t.classList.toggle('active', t.dataset.sheet === name));
            const ws = workbook.Sheets[name];
            sheetData = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
            if (sheetData.length === 0) { showToast('该工作表没有数据', 'error'); return; }

            // Detect multi-row header
            detectedHeaderCount = detectHeaderRows(sheetData, ws);
            headerRowCountInput.value = detectedHeaderCount;
            headerRowCountInput.max = Math.min(sheetData.length - 1, 20);

            // Build headers based on detected/selected header row count
            rebuildHeaders();

            // Preserve merged cells (header area only) and column widths from original sheet
            refreshHeaderMerges();
            expandMergedCells(detectedHeaderCount);
            originalCols = ws['!cols'] || [];

            selectedColIndex = -1;
            startRowInput.value = detectedHeaderCount + 1;
            startRowInput.max = sheetData.length;
            startRowInput.min = detectedHeaderCount + 1;
            splitResult = null;

            // Update file meta with row count
            const dataRowCount = sheetData.length - detectedHeaderCount;
            fileMeta.textContent = `${workbook.SheetNames.length} 个工作表 · ${sheetData.length} 总行 · ${dataRowCount} 数据行`;

            // 表头行数设置始终显示：检测可能有误差，用户需能结合预览核对并手动修正
            headerRowSetting.classList.add('show');
            headerRowHint.textContent = detectedHeaderCount > 1
                ? `已自动检测为 ${detectedHeaderCount} 行表头，请结合下方预览核对`
                : `已自动检测为 1 行表头，如是多行表头请在此修改`;
            headerRowHint.style.color = '#5ca97f';

            renderFieldGrid();
            columnCard.classList.remove('disabled');
            settingsCard.classList.add('disabled');
            saveCard.classList.add('disabled');
            splitInfo.classList.remove('show');
            previewWrapper.classList.add('hidden');
            resultArea.classList.remove('show');
            progressBar.classList.remove('show');
            splitBtn.disabled = true;
        }

        /**
         * 检测表头行数（保守策略：宁可漏检也不把数据行吞成表头）。
         * 检测结果仅作为默认值，用户可在始终可见的"表头行数"输入框中修改。
         *
         * 规则：
         * 1. 只信任锚定在第 1 行(s.r===0)、且结束行不超过 5 的合并单元格——
         *    这是多级表头的特征。数据区从第 2 行才开始的纵向合并（如部门列 B2:B50）、
         *    以及跨几十行的纵向大标题（A1:A30）都不会再被误判。
         * 2. 第 1 行几乎空白（≤1 格有值，如横向合并的大标题）→ 真实表头从第 2 行开始。
         * 3. 无合并的分组表头：末行表头有大片空缺(≥30%)、下一行填满(≥95%)且以文本为主(≥80%)
         *    → 只额外扩展 1 行。数据行填满时会在此停止，不会像旧逻辑那样链式吞掉多行。
         */
        function detectHeaderRows(data, ws) {
            if (!data || data.length === 0) return 1;
            const CAP = 5;
            const checkRows = data.slice(0, Math.min(data.length, 10));
            const colCount = Math.max(...checkRows.map(r => (r || []).length));
            if (colCount === 0) return 1;

            const filledCount = row => (row || []).slice(0, colCount)
                .filter(v => String(v ?? '').trim() !== '').length;

            // 1) 合并单元格：仅统计锚定在第 1 行且范围较小的
            let maxEnd = 0;
            for (const m of (ws['!merges'] || [])) {
                if (m.s.r === 0 && m.e.r > maxEnd && m.e.r <= CAP - 1) maxEnd = m.e.r;
            }
            let count = maxEnd + 1;

            // 2) 大标题行：第 1 行几乎空白且下一行更满
            if (colCount >= 3 && data.length > 2 &&
                filledCount(data[0]) <= 1 &&
                filledCount(data[1]) > filledCount(data[0])) {
                count = Math.max(count, 2);
            }

            // 3) 无合并的分组表头：末行有空缺、下一行填满且以文本为主 → 仅扩展 1 行
            if (count < CAP && data.length > count + 1) {
                const last = data[count - 1] || [];
                const next = data[count] || [];
                const lastFilled = filledCount(last);
                const nextFilled = filledCount(next);
                const nextText = next.slice(0, colCount).filter(v => {
                    const s = String(v ?? '').trim();
                    return s !== '' && !/^-?\d+\.?\d*$/.test(s);
                }).length;
                if (lastFilled > 0 &&
                    (colCount - lastFilled) / colCount >= 0.3 &&
                    nextFilled / colCount >= 0.95 &&
                    nextText / nextFilled >= 0.8) {
                    count += 1;
                }
            }

            return Math.min(Math.max(count, 1), CAP);
        }

        /**
         * 按当前"表头行数"重算需要带进输出文件的合并单元格。
         * 只保留完整落在表头区内的合并，避免把数据行的合并范围套到输出文件上，
         * 导致输出文件中数据被错误的合并吞掉。
         */
        function refreshHeaderMerges() {
            const count = parseInt(headerRowCountInput.value) || 1;
            const ws = (workbook && workbook.Sheets[currentSheet]) || {};
            headerMerges = (ws['!merges'] || []).filter(m => m.s.r < count && m.e.r < count);
        }

        /**
         * 展开数据区的纵向合并单元格：把合并范围内除左上角外的单元格填充为左上角的值。
         * 否则按合并列（如"部门"列纵向合并）拆分时，除首行外都会被读成空值、
         * 全部归进一个空分组。表头区内的合并不处理。
         */
        function expandMergedCells(headerCount) {
            const ws = (workbook && workbook.Sheets[currentSheet]) || {};
            for (const m of (ws['!merges'] || [])) {
                if (m.s.c !== m.e.c || m.e.r < headerCount) continue;
                const anchorRow = sheetData[m.s.r];
                if (!anchorRow) continue;
                const anchorVal = anchorRow[m.s.c];
                if (anchorVal === undefined || anchorVal === null || anchorVal === '') continue;
                for (let r = Math.max(m.s.r, headerCount); r <= m.e.r; r++) {
                    if (!sheetData[r]) continue;
                    sheetData[r][m.s.c] = anchorVal;
                }
            }
        }

        /**
         * Rebuild headers from raw data using the current headerRowCount value.
         * For multi-row headers, merge cell values vertically with space.
         */
        function rebuildHeaders() {
            const count = parseInt(headerRowCountInput.value) || 1;
            headerRows = sheetData.slice(0, count);

            // Determine column count
            let maxCols = 0;
            for (const row of headerRows) {
                if (row) maxCols = Math.max(maxCols, row.length);
            }

            headers = [];
            for (let c = 0; c < maxCols; c++) {
                const parts = [];
                for (let r = 0; r < count; r++) {
                    const val = String((headerRows[r] && headerRows[r][c]) ?? '').trim();
                    if (val !== '') parts.push(val);
                }
                const merged = parts.join(' ');
                headers.push(merged !== '' ? merged : `列${c + 1}`);
            }
        }

        // ==================== Step 2: Select Column ====================
        function renderFieldGrid() {
            fieldGrid.innerHTML = '';
            headers.forEach((h, i) => {
                const item = document.createElement('div');
                item.className = 'field-item';
                item.innerHTML = `<span class="radio"></span><span>${esc(h)}</span><span class="col-index">${colLetter(i)}</span>`;
                item.addEventListener('click', () => selectColumn(i));
                fieldGrid.appendChild(item);
            });
        }

        function selectColumn(index) {
            selectedColIndex = index;
            document.querySelectorAll('.field-item').forEach((item, i) => item.classList.toggle('selected', i === index));
            settingsCard.classList.remove('disabled');
            saveCard.classList.remove('disabled');
            splitResult = null;
            resultArea.classList.remove('show');
            progressBar.classList.remove('show');
            updatePreview();
        }

        // ==================== Step 3: Preview ====================
        startRowInput.addEventListener('input', () => { splitResult = null; resultArea.classList.remove('show'); updatePreview(); });
        headerRowCountInput.addEventListener('input', () => {
            const val = parseInt(headerRowCountInput.value) || 1;
            if (val !== detectedHeaderCount) {
                headerRowHint.textContent = `手动设置（自动检测为 ${detectedHeaderCount} 行）`;
                headerRowHint.style.color = '#c08a3e';
            } else {
                headerRowHint.textContent = `自动检测到 ${detectedHeaderCount} 行表头`;
                headerRowHint.style.color = '#5ca97f';
            }
            rebuildHeaders();
            refreshHeaderMerges();
            expandMergedCells(val);
            startRowInput.min = val + 1;
            if (parseInt(startRowInput.value) <= val) startRowInput.value = val + 1;
            selectedColIndex = -1;
            renderFieldGrid();
            settingsCard.classList.add('disabled');
            saveCard.classList.add('disabled');
            splitInfo.classList.remove('show');
            previewWrapper.classList.add('hidden');
            resultArea.classList.remove('show');
            splitResult = null;
            splitBtn.disabled = true;
        });

        /** 统一计算数据起始行（0 基），预览与实际拆分共用，避免两处口径不一致 */
        function getEffectiveStartRow() {
            const headerCount = parseInt(headerRowCountInput.value) || 1;
            const startRow = parseInt(startRowInput.value);
            if (isNaN(startRow)) return headerCount;
            return Math.max(headerCount, startRow - 1);
        }

        function updatePreview() {
            if (selectedColIndex < 0) return;
            const startRow = getEffectiveStartRow();
            const groups = getSplitGroups(startRow);

            if (groups.size > 0) {
                splitInfo.classList.add('show');
                let html = `将按 <strong>"${esc(headers[selectedColIndex])}"</strong> 列拆分，共 <strong>${groups.size}</strong> 个分组（按数据中出现顺序）：<br>`;
                for (const [key, rows] of groups.entries()) { html += `• <strong>${esc(key)}</strong>：${rows.length} 行数据<br>`; }
                splitDetail.innerHTML = html;
            } else {
                splitInfo.classList.remove('show');
            }

            previewWrapper.classList.remove('hidden');
            let html = '<thead>';
            // Render multi-row header
            for (let hr = 0; hr < headerRows.length; hr++) {
                html += '<tr>';
                const row = headerRows[hr];
                for (let c = 0; c < headers.length; c++) {
                    const val = String((row && row[c]) ?? '');
                    html += `<th${c === selectedColIndex ? ' class="highlight-col"' : ''}>${esc(val)}</th>`;
                }
                html += '</tr>';
            }
            html += '</thead><tbody>';
            const limit = Math.min(sheetData.length, startRow + 50);
            for (let r = startRow; r < limit; r++) {
                const row = sheetData[r] || [];
                html += '<tr>';
                headers.forEach((_, i) => { html += `<td${i === selectedColIndex ? ' class="highlight-col"' : ''}>${esc(String(row[i] ?? ''))}</td>`; });
                html += '</tr>';
            }
            html += '</tbody>';
            previewTable.innerHTML = html;
            splitBtn.disabled = groups.size === 0;
        }

        function getSplitGroups(startRow) {
            // 使用 Map 分组：
            // 1. 保持拆分列值在数据中首次出现的顺序，输出文件顺序与数据顺序一致，
            //    不依赖拆分列是否已排序（普通对象会把整数型 key 排到最前面，打乱顺序）；
            // 2. 避免对象原型链问题（值为 __proto__/constructor 等时会崩溃或丢行）。
            const groups = new Map();
            for (let r = startRow; r < sheetData.length; r++) {
                const row = sheetData[r] || [];
                const key = String(row[selectedColIndex] ?? '');
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(row);
            }
            return groups;
        }

        // ==================== Step 4: Split & Download ====================
        splitBtn.addEventListener('click', executeSplit);

        async function executeSplit() {
            if (selectedColIndex < 0) { showToast('请先选择拆分列', 'error'); return; }

            const startRow = getEffectiveStartRow();
            const groups = getSplitGroups(startRow);
            const keys = [...groups.keys()];

            if (keys.length === 0) { showToast('没有可拆分的数据', 'error'); return; }

            progressBar.classList.add('show');
            resultArea.classList.remove('show');
            resultList.innerHTML = '';
            progressFill.style.width = '0%';
            progressText.textContent = '正在拆分数据...';
            splitBtn.disabled = true;

            try {
                // Build all Excel files in memory
                const files = [];
                const zip = new JSZip();
                const usedNames = new Set(); // 不同 key 转义后可能同名，避免 ZIP 内互相覆盖

                for (let i = 0; i < keys.length; i++) {
                    const key = keys[i];
                    const rows = groups.get(key);
                    const pct = Math.round(((i + 1) / keys.length) * 100);
                    progressFill.style.width = pct + '%';
                    progressText.textContent = `正在拆分 (${i + 1}/${keys.length})：${key}`;

                    // Build workbook — use original multi-row headers
                    const wsData = [...headerRows, ...rows];
                    const ws = XLSX.utils.aoa_to_sheet(wsData);

                    // Apply merged cells from original header area
                    if (headerMerges.length > 0) {
                        ws['!merges'] = headerMerges.map(m => ({
                            s: { r: m.s.r, c: m.s.c },
                            e: { r: m.e.r, c: m.e.c }
                        }));
                    }

                    // Apply original column widths
                    if (originalCols.length > 0) {
                        ws['!cols'] = originalCols.map(col => ({ ...col }));
                    }

                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');

                    let safeName = String(key).replace(/[\\/:*?"<>|]/g, '_').trim().slice(0, 80) || '未命名';
                    let fileNameStr = `${originalFileName}_${safeName}.xlsx`;
                    let seq = 2;
                    while (usedNames.has(fileNameStr)) fileNameStr = `${originalFileName}_${safeName}_${seq++}.xlsx`;
                    usedNames.add(fileNameStr);

                    // Generate binary
                    const xlsxData = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
                    const blob = new Blob([xlsxData], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

                    files.push({ name: fileNameStr, blob, rowCount: rows.length });
                    zip.file(fileNameStr, xlsxData);

                    // Add to result list
                    const item = document.createElement('div');
                    item.className = 'result-item';
                    item.innerHTML = `<span class="check">✅</span><span class="file-name">${esc(fileNameStr)}</span><span class="row-count">${rows.length} 行</span>`;
                    resultList.appendChild(item);
                }

                // Generate ZIP blob
                progressText.textContent = '正在打包 ZIP...';
                const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });

                splitResult = { zipBlob, files };
                progressFill.style.width = '100%';
                progressText.textContent = `✅ 拆分完成！共 ${keys.length} 个文件，点击下方按钮下载`;
                resultArea.classList.add('show');
                showToast(`拆分成功！共 ${keys.length} 个文件`, 'success');

            } catch (err) {
                showToast('拆分失败：' + err.message, 'error');
                console.error(err);
                progressBar.classList.remove('show');
            }

            splitBtn.disabled = false;
        }

        // Download all as ZIP
        downloadAllBtn.addEventListener('click', () => {
            if (!splitResult || !splitResult.zipBlob) {
                showToast('请先执行拆分操作', 'error');
                return;
            }
            const url = URL.createObjectURL(splitResult.zipBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${originalFileName}_拆分结果.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('ZIP 下载已开始！', 'success');
        });

        // Download files one by one
        downloadOneBtn.addEventListener('click', async () => {
            if (!splitResult || !splitResult.files.length) {
                showToast('请先执行拆分操作', 'error');
                return;
            }
            showToast(`开始逐个下载 ${splitResult.files.length} 个文件...`, 'info');
            for (const file of splitResult.files) {
                const url = URL.createObjectURL(file.blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                await new Promise(r => setTimeout(r, 600));
            }
            showToast('全部下载完成！', 'success');
        });

        // ==================== Reset ====================
        resetBtn.addEventListener('click', resetAll);

        function resetAll() {
            workbook = null; currentSheet = null; sheetData = []; headers = [];
            headerRows = []; headerMerges = []; originalCols = []; detectedHeaderCount = 1;
            selectedColIndex = -1; originalFileName = ''; splitResult = null;
            fileInput.value = '';
            fileInfo.classList.remove('show');
            uploadArea.style.display = '';
            sheetTabs.innerHTML = ''; sheetTabs.classList.remove('show');
            sheetHint.style.display = 'none';
            fieldGrid.innerHTML = '';
            columnCard.classList.add('disabled');
            settingsCard.classList.add('disabled');
            saveCard.classList.add('disabled');
            headerRowSetting.classList.remove('show');
            splitInfo.classList.remove('show');
            previewWrapper.classList.add('hidden');
            progressBar.classList.remove('show');
            resultArea.classList.remove('show');
            resultList.innerHTML = '';
            splitBtn.disabled = true;
            startRowInput.value = 2;
            headerRowCountInput.value = 1;
        }

        // ==================== Utilities ====================
        function esc(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
        function colLetter(i) { let r = '', n = i; while (n >= 0) { r = String.fromCharCode(65 + (n % 26)) + r; n = Math.floor(n / 26) - 1; } return r; }

        // ============ THEME BRIDGE（与工作台亮/暗主题联动） ============
        (function () {
            var params = new URLSearchParams(location.search);
            var theme = params.get('theme') === 'dark' ? 'dark' : 'light';
            document.documentElement.dataset.theme = theme;
            window.addEventListener('message', function (e) {
                var d = e.data || {};
                if (d.type === 'tool-theme' && (d.theme === 'light' || d.theme === 'dark')) {
                    document.documentElement.dataset.theme = d.theme;
                }
            });
            try { window.parent.postMessage({ type: 'tool-ready', tool: 'excel-splitter' }, '*'); } catch (err) { /* ignore */ }
        })();
    </script>
</body>
</html>
